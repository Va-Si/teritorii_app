<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teritorii</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Favicon Colorat -->
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/854/854878.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/854/854878.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <!-- Firebase & Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    .square-btn { 
      width: 100%;
      aspect-ratio: 1 / 1; max-width: 48px; margin: 0 auto; 
      border-width: 2px; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center;
      padding: 2px; overflow: hidden; position: relative;
    }
    .btn-text-truncate {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      line-height: 1.1;
      font-size: clamp(0.55rem, 3vw, 0.75rem);
      font-weight: 800;
      text-align: center;
      width: 100%;
    }
    .progress-bar { transition: width 0.5s ease-in-out; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-track { margin: 4px; }
  body {
  height: 100%;
  overflow: hidden;              /* NU mai lăsăm body să scrolleze */
  overscroll-behavior-y: none;   /* taie “bounce/refresh” */
}
	  #root {
  height: 100vh;
  overflow-y: auto;              /* scroll aici */
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain; /* nu “propagă” overscroll la pagină */
}


    
    .sortable-ghost { opacity: 0.4; }
    .sortable-drag { cursor: grabbing !important; }
    .drag-handle { cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
  </style>
</head>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 overflow-hidden">
  <div id="root"></div>
  

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    
    const firebaseConfig = {
      apiKey: "AIzaSyCU2oefYIppsqJE2aVrhnIvm_D2oDhNZgQ",
      authDomain: "jw-teritorii.firebaseapp.com",
      projectId: "jw-teritorii",
      storageBucket: "jw-teritorii.firebasestorage.app",
      messagingSenderId: "869337688836",
      appId: "1:869337688836:web:0b12b8276ae043e39e3e51"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
      // Această linie permite Firebase să salveze datele în "seiful" telefonului
      firebase.firestore().enablePersistence({ synchronizeTabs: true })
        .catch((err) => {
          console.warn("Modul offline nu s-a putut activa:", err.code);
        });             
    }
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    const ADMIN_EMAIL = 'valeriu.siminitchi@gmail.com';
    const DEFAULT_GROUPS = ['Grupa 1', 'Grupa 2', 'Grupa 3', 'Grupa 4', 'Grupa 5'];

    const DEFAULT_LABELS = [
      { id: 'nevizitat', label: 'Nevizitat', color: '#ffffff', textColor: '#1e293b', isCampaignTarget: false },
      { id: 'lipsa', label: 'Lipsă', color: '#94a3b8', textColor: '#ffffff', isCampaignTarget: false },
      { id: 'initiala', label: 'V. Inițială', color: '#facc15', textColor: '#000000', isCampaignTarget: false },
      { id: 'ulterioara', label: 'V. Ulterioară', color: '#22c55e', textColor: '#ffffff', isCampaignTarget: false },
      { id: 'rusa', label: 'Rusă', color: '#3b82f6', textColor: '#ffffff', isCampaignTarget: false },
      { id: 'posta', label: 'În poștă', color: '#dc2626', textColor: '#ffffff', isCampaignTarget: true },
      { id: 'invitatie', label: 'Invitație', color: '#a855f7', textColor: '#ffffff', isCampaignTarget: true },
      { id: 'refuz', label: 'Refuz', color: '#ef4444', textColor: '#ffffff', isCampaignTarget: false },
      { id: 'refuz-categoric', label: 'R. Categoric', color: '#7f1d1d', textColor: '#ffffff', isCampaignTarget: false }
    ];
    
    const formatDate = (dateStr) => {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
      return dateStr;
    };

    // <--- ADAUGĂ HELPER-UL AICI, ÎNAINTE DE COMPONENTELE UI
    const valideazaCampul = (input, mesaj) => {
      input.setCustomValidity(""); // Resetăm eroarea veche
      if (!input.value.trim()) {
        input.setCustomValidity(mesaj);
        input.reportValidity();
        return false; // E eroare, returnează false
      }
      return true; // E totul bine, returnează true
    };

    const ResizableTextarea = ({ defaultValue, onBlur, placeholder, disabled }) => {
      const [height, setHeight] = useState(70);
      const isDragging = useRef(false);
      const lastY = useRef(0);

      useEffect(() => {
        const handleMove = (e) => {
          if (!isDragging.current) return;
          e.preventDefault(); 
          const currentY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
          const deltaY = currentY - lastY.current;
          setHeight(prev => Math.max(70, prev + deltaY));
          lastY.current = currentY;
        };
        const handleEnd = () => {
          isDragging.current = false;
          document.body.style.userSelect = '';
        };

        document.addEventListener('mousemove', handleMove);
        document.addEventListener('mouseup', handleEnd);
        document.addEventListener('touchmove', handleMove, { passive: false });
        document.addEventListener('touchend', handleEnd);

        return () => {
          document.removeEventListener('mousemove', handleMove);
          document.removeEventListener('mouseup', handleEnd);
          document.removeEventListener('touchmove', handleMove);
          document.removeEventListener('touchend', handleEnd);
        };
      }, []);

      const handleStart = (e) => {
        isDragging.current = true;
        lastY.current = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
        document.body.style.userSelect = 'none';
      };

      return (
        <div className={`flex flex-col w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm focus-within:ring-2 focus-within:ring-blue-400 transition-shadow overflow-hidden ${disabled ? 'opacity-80' : ''}`}>
          <textarea 
            className="w-full text-xs font-bold text-slate-600 dark:text-slate-300 bg-transparent p-4 pb-2 outline-none border-none resize-none overflow-y-auto" 
            style={{ height: `${height}px` }}
            defaultValue={defaultValue}
            onBlur={onBlur}
            placeholder={placeholder}
            disabled={disabled}
          ></textarea>
          {!disabled && (
            <div 
              onMouseDown={handleStart}
              onTouchStart={handleStart}
              className="w-full h-4 flex items-center justify-center cursor-ns-resize group bg-slate-50 dark:bg-slate-700/50 hover:bg-slate-100 dark:hover:bg-slate-700 border-t border-slate-100 dark:border-slate-700 transition-colors"
            >
              <div className="w-1/3 max-w-[80px] h-1 bg-slate-300 dark:bg-slate-500 rounded-full group-hover:bg-slate-400 dark:group-hover:bg-slate-400 transition-colors"></div>
            </div>
          )}
        </div>
      );
    };

    function SettingsLabelList({ settings, updateSettingsLabels, setAlertBox }) {
      const listRef = useRef(null);
      useEffect(() => {
        if (!listRef.current) return;
        const sortable = Sortable.create(listRef.current, {
          animation: 150, handle: '.drag-handle', forceFallback: true,
          onEnd: (evt) => {
             if (evt.oldIndex !== evt.newIndex) {
                 const newLabels = [...settings.labels];
                 const [movedItem] = newLabels.splice(evt.oldIndex, 1);
                 newLabels.splice(evt.newIndex, 0, movedItem);
                 
                 const item = evt.item;
                 const from = evt.from;
                 const originalNextSibling = from.children[evt.oldIndex > evt.newIndex ? evt.oldIndex + 1 : evt.oldIndex];
                 if (originalNextSibling) from.insertBefore(item, originalNextSibling);
                 else from.appendChild(item);
                 
                 updateSettingsLabels(newLabels);
             }
          }
        });
        return () => sortable.destroy();
      }, [settings.labels, updateSettingsLabels]);

      const handleColorChange = (id, field, value) => updateSettingsLabels(settings.labels.map(l => l.id === id ? { ...l, [field]: value } : l));
      const handleLabelNameChange = (id, newName) => updateSettingsLabels(settings.labels.map(l => l.id === id ? { ...l, label: newName } : l));
      const addLabel = () => updateSettingsLabels([...settings.labels, { id: Date.now().toString(), label: 'Nou', color: '#ffffff', textColor: '#000000', isCampaignTarget: false }]);
      const deleteLabel = (id) => {
        if(settings.labels.length <= 1) return;

        // Găsim numele etichetei pe care vrem să o ștergem pentru a-l afișa în mesaj
        const targetLabel = settings.labels.find(l => l.id === id);
        const labelName = targetLabel ? targetLabel.label : 'această etichetă';

        setAlertBox({
          isOpen: true,
          title: 'Ștergere Etichetă',
          message: `Ești sigur că dorești să ștergi eticheta "${labelName}"? Toate apartamentele cu acest status se vor reseta la starea implicită.`,
          isDanger: true,
          onConfirm: () => {
            updateSettingsLabels(settings.labels.filter(l => l.id !== id));
          }
        });
      };

      return (
        <div className="space-y-4 pb-12 flex flex-col items-center">
          <div ref={listRef} className="space-y-4 w-full">

            {settings.labels.map(l => (
  <div key={l.id} className="bg-slate-50 dark:bg-slate-800 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm max-w-[700px] w-full mx-auto flex flex-col md:flex-row gap-3">
    
    {/* Chenar etihete si culori RÂNDUL 1: Drag + Nume */}
    <div className="flex flex-row items-center gap-3 w-full">
        <div className="drag-handle flex items-center justify-center cursor-grab active:cursor-grabbing text-slate-400 hover:text-slate-600 shrink-0 h-[44px]">
             <span className="material-icons">drag_indicator</span>
        </div>
        <div className="flex-1 min-w-0">
             {/* Am șters overflow-hidden și am pus h-auto, min-h-12 pentru a permite scroll-ul */}
             <textarea 
                rows="1" 
                value={l.label} 
                onChange={(e) => handleLabelNameChange(l.id, e.target.value)} 
                className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-3 font-black text-sm uppercase outline-none focus:ring-2 focus:ring-blue-500 h-auto min-h-[44px] block overflow-y-auto" 
                placeholder="Nume Etichetă"
             />
        </div>
    </div>

    {/* RÂNDUL 2: Controale */}
    <div className="flex flex-row items-center justify-between gap-3 w-full border-t border-slate-200 dark:border-slate-700 pt-3 md:border-none md:pt-0 md:w-auto md:justify-end">
        
        {/* Progres - Aici am pus "Checkbox-ul fals" care răspunde instant la click */}
        <div className="flex flex-row items-center gap-1">
          <div 
            onClick={(e) => {
                e.preventDefault();
                e.stopPropagation(); // Oprește librăria de sortare să intervină
                const newLabels = settings.labels.map(item => 
                    item.id === l.id ? { ...item, isCampaignTarget: !item.isCampaignTarget } : item
                );
                updateSettingsLabels(newLabels);
            }}
            /* AICI SUNT CLASELE DE DIMENSIUNE */
            className={`w-9 h-9 rounded-lg border flex items-center justify-center cursor-pointer transition-colors ${l.isCampaignTarget ? 'bg-blue-500 border-blue-500' : 'bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-600'}`}
          >
            {/* AICI ESTE ICONIȚA */}
            {l.isCampaignTarget && <span className="material-icons text-white">check</span>}
          </div>
          <span className="[writing-mode:vertical-rl] rotate-180 text-[8px] font-black uppercase text-slate-400 whitespace-nowrap select-none">Prog.</span>
        </div>

        {/* Fundal */}
        <div className="flex flex-row items-center gap-1">
          <input type="color" value={l.color} onChange={(e) => handleColorChange(l.id, 'color', e.target.value)} className="w-10 h-10 rounded-lg cursor-pointer border-0 shadow-sm block" />
          <span className="[writing-mode:vertical-rl] rotate-180 text-[8px] font-black uppercase text-slate-400 whitespace-nowrap select-none">Fund.</span>
        </div>

        {/* Text */}
        <div className="flex flex-row items-center gap-1">
          <input type="color" value={l.textColor} onChange={(e) => handleColorChange(l.id, 'textColor', e.target.value)} className="w-10 h-10 rounded-lg cursor-pointer border-0 shadow-sm block" />
          <span className="[writing-mode:vertical-rl] rotate-180 text-[8px] font-black uppercase text-slate-400 whitespace-nowrap select-none">Text</span>
        </div>
        
        {/* Ștergere */}
        <div className="flex items-center justify-center">
          {settings.labels.length > 1 ? (
            <button onClick={() => deleteLabel(l.id)} className="w-10 h-10 bg-red-100 text-red-500 rounded-lg flex items-center justify-center hover:bg-red-200 shadow-sm">
                <span className="material-icons text-[20px]">delete</span>
            </button>
          ) : (
            <div className="w-10 h-10"></div>
          )}
        </div>
    </div>
  </div>
))}

          

          




            
          </div>
          <button onClick={addLabel} className="w-full max-w-[700px] mx-auto p-4 border-2 border-dashed border-blue-300 text-blue-500 font-black uppercase text-xs rounded-2xl flex items-center justify-center gap-2 hover:bg-blue-50 shadow-sm">
             <span className="material-icons">add</span> Adaugă Etichetă
          </button>
        </div>
      );
    }

    function SectionLocations({ blockId, sec, getLabelStyle, openEditModal, handleReorderLocations, isBlockStrada, isGroupedStrada, canEditStructure, isReadOnly, territory, setAlertBox }) {
      const gridRef = useRef(null);
      const isUngroupedSection = !sec.name || sec.name === 'Case';
      
      useEffect(() => {
        if (!gridRef.current || !canEditStructure) return;
        const sortable = Sortable.create(gridRef.current, {
          group: 'shared-locations', animation: 150, delay: 200, delayOnTouchOnly: true, forceFallback: true, fallbackTolerance: 5,
          onEnd: (evt) => {
            const destBlockId = evt.to.dataset.blockId;
            const destSecId = evt.to.dataset.sectionId;
            if (evt.from !== evt.to || evt.oldIndex !== evt.newIndex) {
                const item = evt.item;
                const from = evt.from;
                const originalNextSibling = from.children[evt.oldIndex > evt.newIndex ? evt.oldIndex + 1 : evt.oldIndex];
                if (originalNextSibling) from.insertBefore(item, originalNextSibling);
                else from.appendChild(item);
            }
            if (destBlockId && destSecId) {
              if (evt.from !== evt.to || evt.oldIndex !== evt.newIndex) {
                 handleReorderLocations(blockId, sec.id, destBlockId, destSecId, evt.oldIndex, evt.newIndex);
              }
            }
          }
        });
        return () => sortable.destroy();
      }, [blockId, sec.id, sec.locations, canEditStructure]);

      const gridClasses = `p-4 grid gap-2.5 min-h-[60px] ${
        isBlockStrada && isUngroupedSection
          ? 'grid-cols-5 md:grid-cols-12' 
          : 'grid-cols-5 md:grid-cols-6'
      }`;

      return (
        <div ref={gridRef} data-block-id={blockId} data-section-id={sec.id} className={gridClasses}>
          {sec.locations.map((loc, lIdx) => (
            <button key={loc.id} 
              onClick={() => {
                // 1. Verificăm dacă suntem Offline și pe o Grupă
                if (!navigator.onLine && territory?.category !== 'personal') {
                    setAlertBox({ 
                      isOpen: true, 
                      title: 'Fără conexiune',
                      message: 'Ești offline! Doar teritoriile din "Personal" pot fi modificate fără internet.',
                      isDanger: true,
                      showCancel: false,
                      onConfirm: () => {} 
                    });
                    return;
                }
                // 2. Verificăm permisiunea (isReadOnly - care oricum se aplică online)
                if (isReadOnly) {
                  setAlertBox({
                    isOpen: true,
                    title: 'Doar Vizualizare',
                    message: 'Nu ai permisiunea de a edita teritoriile altei grupe.',
                    isDanger: true,
                    showCancel: false,
                    onConfirm: () => {}
                });
                return;
            }
                // 3. Dacă totul e ok, deschidem
                openEditModal(blockId, sec.id, loc, lIdx);
              }} 
              style={getLabelStyle(loc.status)}
              className="square-btn rounded-lg shadow-sm" // <--- AM ȘTERS cursor-not-allowed DE
          >
              <span className="btn-text-truncate">{loc.number}</span>
              {loc.notes && <div className="absolute top-1 right-1 w-2 h-2 bg-indigo-500 rounded-full border border-white"></div>}
            </button>
          ))}
        </div>
      );
    }

    function BlockComponent({ block, territory, getLabelStyle, openEditModal, openRenameModal, handleReorderLocations, handleReorderSections, updateTerritory, collapsedBlocks, toggleBlock, collapsedSections, toggleSection, setModals, modals, canEditStructure, isReadOnly, setAlertBox }) {
      const isBlockStrada = block.type === 'strada';
      const isBlockCollapsed = collapsedBlocks[block.id];
      const sectionsGridRef = useRef(null);

      const unGroupedLocationsSections = (block.sections || []).filter(sec => !sec.name || sec.name === 'Case');
      const groupedSections = (block.sections || []).filter(sec => sec.name && sec.name !== 'Case');
      // <--- AICI O PUI conditia logica care verifica si calculeaza daca exista case :
  const hasHouses = (block.sections || []).some(s => s.locations && s.locations.length > 0);

useEffect(() => {
    if (!sectionsGridRef.current || !canEditStructure) return;
    
    const sortable = Sortable.create(sectionsGridRef.current, {
        group: 'shared-sections', 
        animation: 250, // Am crescut animația la 250ms pentru a fi mai fluidă
        delay: 200, 
        delayOnTouchOnly: true, 
        forceFallback: true, 
        fallbackTolerance: 5,
        handle: '.section-header', 
        filter: '.no-drag',
        onEnd: (evt) => {
            // 1. Vizual: Fixăm elementul la locul lui după ce drumul (drag) s-a terminat
            const item = evt.item;
            const from = evt.from;
            const originalNextSibling = from.children[evt.oldIndex > evt.newIndex ? evt.oldIndex + 1 : evt.oldIndex];
            if (originalNextSibling) from.insertBefore(item, originalNextSibling);
            else from.appendChild(item);

            // 2. Logica: Trimitem indicii exacti către baza de date
            const destBlockId = evt.to.dataset.blockId;
            if (destBlockId && (block.id !== destBlockId || evt.oldIndex !== evt.newIndex)) {
                handleReorderSections(block.id, destBlockId, evt.oldIndex, evt.newIndex);
            }
        }
    });
    
    return () => sortable.destroy();
}, [block.sections, canEditStructure, block.id]); // Am adăugat block.id în dependențe pentru siguranță

return (
  <div className="bg-slate-200/50 dark:bg-slate-800/50 p-3 md:p-5 rounded-[2rem] border-2 border-slate-200/60 dark:border-slate-700/60 relative block-item" data-block-id={block.id}>
    {/* block-header: Am schimbat items-center în items-start pentru cazul în care numele trece pe rândul 2 */}
    <div className="block-header flex justify-between items-start mb-4 px-2 cursor-pointer select-none gap-3" onClick={() => toggleBlock(block.id)}>
      
      {/* Zona din stânga: Săgeată + Iconiță + Nume + Buton Editare */}
      <div className="flex items-start gap-2 flex-1 min-w-0">
        <span className="material-icons text-slate-500 text-2xl transition-transform duration-200 shrink-0 mt-0.5" style={{ transform: isBlockCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)' }}>keyboard_arrow_down</span>
        <span className="material-icons text-slate-400 text-xl shrink-0 mt-1">{isBlockStrada ? 'signpost' : 'domain'}</span>
        
        {/* REPARAT: Am eliminat 'truncate' și 'flex', permițând textului să se extindă flexibil pe mobil */}
        <h2 className="font-black text-sm md:text-base text-slate-800 dark:text-slate-200 uppercase tracking-widest whitespace-normal break-words flex-1 min-w-0 pr-1">
          {isBlockStrada ? 'STRADĂ:' : 'BLOC:'} {block.name}
          
          {/* Micul buton de editare integrat sigur ca să nu mai fie împins sub chenar */}
          {canEditStructure && (
            <button 
              onClick={(e) => { e.stopPropagation(); openRenameModal('block', block.id, null, block.name); }} 
              className="material-icons text-slate-400 hover:text-blue-500 text-[18px] bg-slate-100 dark:bg-slate-800 p-1.5 rounded-lg transition-colors shadow-sm shrink-0 no-drag inline-flex items-center ml-2 align-middle"
            >
              edit
            </button>
          )}
        </h2>
      </div>

    {/* Zona din dreapta: Butoanele de Acțiune */}
      {canEditStructure && (
        <div className="flex items-center shrink-0 no-drag gap-2" onClick={e => e.stopPropagation()}>
          {/* BUTON NOU: Adaugă Casă (apare doar la străzi) */}
          {isBlockStrada && (
             <button onClick={() => setModals({...modals, stradaAddHouse: block.id})} className="material-icons text-blue-500 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 p-2 rounded-xl hover:bg-blue-50 hover:border-blue-300 transition-all shadow-sm">add</button>
          )}
          {/* BUTON EXISTENT: Ștergere */}
          <button onClick={() => { 
              setAlertBox({
                  isOpen: true,
                  title: isBlockStrada ? 'Ștergere Stradă' : 'Ștergere Bloc',
                  message: `Ești sigur că vrei să ștergi definitiv ${isBlockStrada ? 'această Stradă' : 'acest Bloc'} "${block.name}"? Toate datele din interior se vor perde.`,
                  isDanger: true,
                  onConfirm: () => {
                    updateTerritory(territory.id, territory.category, { blocks: territory.blocks.filter(x => x.id !== block.id) });
                  }
               });
          }} className="material-icons text-red-500 bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 p-2 rounded-xl hover:bg-red-50 hover:border-red-300 transition-all shadow-sm">delete</button>
        </div>
      )}

const closeTopLayer = () => {
  // 1) AlertBox (cel mai sus)

  // 2) PromptBox

  }

  // 3) Modale (închidem un singur modal "cel mai important")
  // Prioritate: cele "de editare" peste cele "de meniu"
  const modalPriority = [
    'locationEdit', 'locationAppend',
    'renameItem', 'stradaAddHouse', 'sectionAdd', 'blockAdd',
    'territoryEdit', 'territoryAdd',
    'adminEditUser', 'adminPanel',
    'profileEdit',
    'settings', 'theme',
    'export', 'report', 'import',
    'auth'
  ];

  for (const k of modalPriority) {
    if (modals?.[k]) {
      setModals(prev => ({ ...prev, [k]: null === prev[k] ? null : (typeof prev[k] === 'boolean' ? false : null) }));
      return true;
    }
  }

  // 4) Dacă ești în interiorul unui teritoriu, ieși la listă
  if (selectedTerritoryId) {
    setSelectedTerritoryId(null);
    return true;
  }

  // Nimic de închis -> lăsăm back-ul să închidă aplicația / pagina
  return false;

const uiDepthRef = React.useRef(0);
const popLockRef = React.useRef(false);

const getModalDepth = () => {
  let c = 0;
  for (const k of MODAL_KEYS) if (modals?.[k]) c++;
  return c;
};

const getUiDepth = () => {
  let d = 0;
  if (selectedTerritoryId) d++;
  d += getModalDepth();
  if (alertBox?.isOpen) d++;
  if (promptBox?.isOpen) d++;
  return d;
};

// Inițializare: ne asigurăm că avem un state de bază
useEffect(() => {
  history.replaceState({ appDepth: 0 }, document.title);
}, []);

useEffect(() => {
  const depth = getUiDepth();

  // Dacă tocmai am venit din back (popstate), nu mai împingem imediat iar state
  if (popLockRef.current) {
    uiDepthRef.current = depth;
    popLockRef.current = false;
    return;
  }

  // Când se deschide ceva nou (depth crește), împingem un state
  if (depth > uiDepthRef.current) {
    history.pushState({ appDepth: depth }, document.title);
  }

  uiDepthRef.current = depth;
}, [
  selectedTerritoryId,
  modals,
  alertBox?.isOpen,
  promptBox?.isOpen
]);

useEffect(() => {

      const safeUpdateLocation = async (territoryId, category, blockId, sectionId, locId, updateFn) => {
        const docRef = category !== 'personal'
            ? db.collection('shared_territories').doc(territoryId)
            : db.collection('users').doc(userDocId).collection('territories').doc(territoryId);

        try {
            await db.runTransaction(async (transaction) => {
                // 1. Citește cele mai noi date DIRECT de pe server
                const doc = await transaction.get(docRef);
                if (!doc.exists) return;
                
                const data = doc.data();
                
                // 2. Modifică doar apartamentul/casa vizată, păstrând restul intact
                const newBlocks = data.blocks.map(b => {
                    if (b.id !== blockId) return b;
                    return { ...b, sections: b.sections.map(s => {
                        if (s.id !== sectionId) return s;
                        return { ...s, locations: s.locations.map(x => {
                            if (x.id !== locId) return x;
                            // Aplicăm funcția de modificare doar pe casa dorită
                            return updateFn(x); 
                        })};
                    })};
                });
                
                // 3. Salvează înapoi pe server
                transaction.update(docRef, { blocks: newBlocks });
            });
        } catch (error) {
            console.error("Eroare la tranzacție:", error);
            setToast("Eroare la sincronizare. Mai încearcă o dată!");
        }
      };

      const parseNumbers = (input, forceEven = false, forceOdd = false) => {
        const locs = [];
        input.split(',').forEach(part => {
          const p = part.trim();
          if (p.includes('-')) {
            const [s, e] = p.split('-').map(n => parseInt(n.trim()));
            if (!isNaN(s) && !isNaN(e)) {
               for (let i = s; i <= e; i++) {
                 if (forceEven && i % 2 !== 0) continue;
                 if (forceOdd && i % 2 === 0) continue;
                 locs.push({ id: Math.random().toString(36).substr(2, 9), number: i.toString(), status: 'nevizitat', notes: '', history: [] });
               }
            }
          } else if (p) {
             const num = parseInt(p);
             if (!isNaN(num)) {
                 if (forceEven && num % 2 !== 0) return;
                 if (forceOdd && num % 2 === 0) return;
             }
             locs.push({ id: Math.random().toString(36).substr(2, 9), number: p, status: 'nevizitat', notes: '', history: [] });
          }
        });
        return locs;
      };

                      }))
                  }));

     const handleImport = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (event) => {
        try {
            const data = JSON.parse(event.target.result);
            const mode = data.exportMode || 'partial';
            const catType = data.exportCategoryType || 'personal';

            if (catType === 'group' && !isAdmin && !isGroupAdmin) {
                alert("Eroare: Doar administratorii pot importa teritorii de grupă!");
                return;
            }

            const targetCategory = catType === 'personal' ? 'personal' : activeGroupView;

           if (data.settings && isAdmin) {
                await db.collection('config').doc('global_settings').set(data.settings);
            }

            // Funcția internă care execută scrierea în Firebase
            const runFirebaseTransaction = async () => {
                if (data.territories && Array.isArray(data.territories)) {
                    // Dacă e mod complet, ștergem mai întâi datele vechi
                    if (mode === 'full') {
                        if (targetCategory === 'personal') {
                            const snap = await db.collection('users').doc(userDocId).collection('territories').get();
                            const batch = db.batch();
                            snap.docs.forEach(d => batch.delete(d.ref));
                            await batch.commit();
                        } else {
                            const snap = await db.collection('shared_territories').where('category', '==', targetCategory).get();
                            const batch = db.batch();
                            snap.docs.forEach(d => batch.delete(d.ref));
                            await batch.commit();
                        }
                    }

                    // Adăugarea noilor teritorii din fișier
                    let batch1 = db.batch();
                    let count = 0;
                    for (const t of data.territories) {
                        const tFixed = { ...t, category: targetCategory };
                        if (targetCategory !== 'personal') tFixed.group = targetCategory;

                        const ref = targetCategory !== 'personal' ?
                            db.collection('shared_territories').doc(t.id) :
                            db.collection('users').doc(userDocId).collection('territories').doc(t.id);

                        batch1.set(ref, tFixed);
                        count++;
                        if (count === 400) {
                            await batch1.commit();
                            batch1 = db.batch();
                            count = 0;
                        }
                    }
                    if (count > 0) await batch1.commit();

                    if (mode === 'full') {
                        // REPARAT 1: La importul COMPLET, închidem direct modalul și NU mai afișăm nicio altă alertă
                        setAlertBox({ isOpen: false, title: '', message: '', isDanger: false });
                        setModals({ ...modals, import: false });
                    // --- ÎNLOCUIEȘTE DOAR NOTIFICAREA DE LA IMPORTUL PARȚIAL ---
                      } else {
                          // Trimitem o configurare care obligă AlertBox să nu afișeze text sau acțiune de anulare
                          setAlertBox({
                                  isOpen: true,
                                  title: 'Import Reușit',
                                  message: 'Teritoriile au fost adăugate cu succes!',
                                  isDanger: false,
                                  showCancel: false, // <--- CORECT
                                  onConfirm: () => {
                                      setAlertBox({ isOpen: false, title: '', message: '', isDanger: false });
                                      setModals({ ...modals, import: false });
                                  }
                              });
                      }
                }
            };

            // Verificăm modul de import ales pentru a ști cum pornim procesul
            if (data.territories && Array.isArray(data.territories)) {
                if (mode === 'full') {
                    // Dacă e FULL, cerem confirmarea cu AlertBox-ul tău ÎNAINTE de import
                    setAlertBox({
                        isOpen: true,
                        title: 'Atenție! Înlocuire Date',
                        message: `Vei ȘTERGE DEFINITIV toate teritoriile actuale din secțiunea "${targetCategory}" și le vei înlocui cu cele din fișierul de backup. Continui?`,
                        isDanger: true,
                        onConfirm: async () => {
                            // Resetăm mai întâi starea alertei pentru a preveni păstrarea butoanelor vechi
                            setAlertBox({ isOpen: false, title: '', message: '', isDanger: false });
                            await runFirebaseTransaction(); 
                        },
                        onCancel: () => {
                            document.getElementById('importData').value = null;
                            setAlertBox({ isOpen: false, title: '', message: '', isDanger: false });
                        }
                    });
                } else {
                    // Dacă e PARTIAL, nu ștergem nimic și nu cerem confirmare la început, ci scriem direct
                    await runFirebaseTransaction();
                }
            }

        } catch (error) { 
            alert("Eroare la import! " + error.message); 
            document.getElementById('importData').value = null;
        }
    };
    reader.readAsText(file);
    e.target.value = null;
};

              <form onSubmit={async (e) => {
                e.preventDefault();
                setAuthError(null);

                const form = e.target;
                if (!valideazaCampul(form.elements.name, "Introdu numele pentru a te conecta!")) return;
                if (!valideazaCampul(form.elements.password, "Introdu parola!")) return;

                try {
                  //Logare useri
                  if (authForm.name.includes('@')) { 
                    // Logarea ta ca Admin (rămâne exact așa cum este acum)
                    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                    await auth.signInWithEmailAndPassword(authForm.name.trim(), authForm.password.trim());
                  } else {
                    // PENTRU UTILIZATORII SIMPLI:
                    // Folosim coduri Unicode (\u...) ca să fim siguri că ștergem diacriticele corect
                    const numeCurat = authForm.name.trim().toLowerCase()
                      .replace(/[\u0103\u00e2]/g, 'a') // înlocuiește ă, â
                      .replace(/[\u00ee]/g, 'i')       // înlocuiește î
                      .replace(/[\u0219\u015f]/g, 's') // înlocuiește ș, ş (ambele variante de ș)
                      .replace(/[\u021b\u0163]/g, 't') // înlocuiește ț, ţ (ambele variante de ț)
                      .replace(/\s+/g, '.');
                    const emailFictiv = numeCurat + '@ter.com';
                    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                    
                    // 1. Îl logăm oficial la Google și îi aflăm ID-ul unic (UID)
                    const userCredential = await auth.signInWithEmailAndPassword(emailFictiv, authForm.password.trim());
                    const userId = userCredential.user.uid;
                    // 2. Deschidem direct sertarul lui prin ID. Regulile Firebase vor permite asta!
                    const doc = await db.collection('app_users').doc(userId).get();
                    if (doc.exists) {
                      const customUser = doc.data();
                      setUser(customUser);
                      setUserDocId(customUser.id);
                      setActiveGroupView(customUser.group || 'Grupa 5');
                      setActiveTab(customUser.group || 'Grupa 5');
                      localStorage.setItem('custom_user', JSON.stringify(customUser));
                    } else {
                      setAuthError('Eroare: Datele din Firestore lipsesc.');
                    }
                  }
                } catch(err) { 
                  // Verificăm dacă eroarea este din cauza numelui sau parolei greșite
                  if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
                    setAuthError('Nume sau parolă incorectă!');
                  } else {
                    // Dacă apare vreo altă eroare neașteptată (ex: lipsă internet), o lăsăm pe cea originală
                    setAuthError('Eroare la conectare: ' + err.message);
                  }
                }
              }} className="space-y-4">
                <div className="text-left">
                    <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Nume Prenume</label>
                    <input name="name" type="text" placeholder="Ex: Ion Popescu" value={authForm.name} 
                      onChange={e => setAuthForm({...authForm, name: e.target.value})} 
                      onInput={(e) => e.target.setCustomValidity("")}

                  </div>
                  <div className="text-left mt-3">
                    <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Parolă</label>
                    <input name="password" type="password" placeholder="Parolă" value={authForm.password} 
                      onChange={e => setAuthForm({...authForm, password: e.target.value})} 
                      onInput={(e) => e.target.setCustomValidity("")}
                      className="w-full bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-black border border-slate-200 dark:border-slate-700 mt-1" />
                </div>
                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl font-black uppercase shadow-sm transition-colors mt-4">Conectare</button>
              </form>
            </div>
          </div>
                  

        );

>

                  {isAdmin && (

                      <span className="material-icons">edit</span> Editează Nume/Parolă

                    <span className="material-icons">logout</span> Deconectare

                </div>

          {modals.profileEdit && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[200]">

                <h3 className="font-black text-lg mb-6 uppercase tracking-widest text-slate-800 dark:text-slate-100 flex items-center gap-2">
                  <span className="material-icons text-blue-500">manage_accounts</span> Editare Profil

                   e.preventDefault();
                   const fd = new FormData(e.target);
                   const newName = fd.get('name').trim();
                   const newPass = fd.get('password').trim();
                   
                   try {
                       const oldName = currentUserName;
                       if(newName && newName !== oldName) {
                           await auth.currentUser.updateProfile({ displayName: newName });
                           setUser(prev => ({...prev, name: newName})); 
                           await updateUserNameInHistory(userDocId, oldName, newName);
                       }
                       if(newPass && newPass.length >= 6) {
                           await auth.currentUser.updatePassword(newPass);
                       }
                       setModals({...modals, profileEdit: false});
                   } catch(err) {
                       alert("Eroare la actualizare: " + err.message);
                   }
                }} className="space-y-4">
                  <div className="text-left">
                     <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Nume Prenume</label>

                  </div>
                  <div className="text-left mt-3">
                     <label className="text-[10px] font-black uppercase text-slate-400 ml-2">Parolă Nouă (Opțional)</label>
                     <input name="password" type="password" placeholder="Minim 6 caractere" className="w-full bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-black border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 mt-1" />

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setModals({...modals, profileEdit: false, auth: true})} className="flex-1 p-4 font-black text-slate-400 uppercase text-xs hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition">Anulează</button>
                    <button type="submit" className="flex-[2] bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl font-black uppercase text-xs shadow-sm transition">Salvează</button>

                    <form onSubmit={async (e) => {
                      e.preventDefault();
                      const form = e.target;
                      if (!valideazaCampul(form.elements.nume, "Introdu numele utilizatorului!")) return;
                      if (!valideazaCampul(form.elements.parola, "Setează o parolă!")) return;

                      const fd = new FormData(e.target);
                      const nume = fd.get('nume').trim();
                      const parola = fd.get('parola').trim();
                      const grupa = fd.get('group');
                      const isAdminGroup = fd.get('isAdminGroup') === 'on';
                      
                      if(nume.length < 3) {
                              setAlertBox({ isOpen: true, title: 'Nume invalid', message: 'Numele e prea scurt!', isDanger: true, showCancel: false, onConfirm: () => {} });
                              return;
                            }
                            if(parola.length < 4) {
                              setAlertBox({ isOpen: true, title: 'Parolă slabă', message: 'Parola trebuie să aibă minim 4 caractere!', isDanger: true, showCancel: false, onConfirm: () => {} });
                              return;
                            }
                            // La fel și pentru eroarea "Acest nume există deja!" -> adaugă showCancel: false

                      try { 
                        //Creare usere
                        const check = await db.collection('app_users').where('name', '==', nume).get();
                        if(!check.empty) {
                          setAlertBox({ isOpen: true, title: 'Atenție', message: 'Acest nume există deja!', isDanger: true, showCancel: false, onConfirm: () => {} });
                          return;
                        }
                        // TRUC TEHNIC: Deschidem o conexiune secundară ca să NU te deconecteze pe tine (Adminul)
                        const secondaryApp = firebase.initializeApp(firebase.app().options, "SecondaryApp");
                        // Folosim aceleași coduri Unicode universale și la creare
                        const numeCurat = nume.trim().toLowerCase()
                          .replace(/[\u0103\u00e2]/g, 'a') // ă, â
                          .replace(/[\u00ee]/g, 'i')       // î
                          .replace(/[\u0219\u015f]/g, 's') // ș, ş
                          .replace(/[\u021b\u0163]/g, 't') // ț, ţ
                          .replace(/\s+/g, '.');
                        
                        const emailFictiv = numeCurat + '@ter.com'; // Va rezulta: ion.popescu@ter.com
                        
                        // Creăm contul la Google și îi extragem ID-ul unic (UID)
                        const userCredential = await secondaryApp.auth().createUserWithEmailAndPassword(emailFictiv, parola.trim());
                        const userId = userCredential.user.uid;
                        
                        await secondaryApp.delete();
                        // Salvăm în Firestore folosind ID-ul unic primit de la Google ca nume de document
                        await db.collection('app_users').doc(userId).set({
                          id: userId, 
                          name: nume, 
                          password: parola,
                          group: grupa,
                          isAdminGroup: isAdminGroup 
                        });

                        e.target.reset();
                        // REPARAT: Alerta albastră pentru succes, integrată în design
                        setAlertBox({
                          isOpen: true,
                          title: 'Succes',
                          message: 'Utilizator creat cu succes și securizat!',
                          isDanger: false,
                          showCancel: false, // <--- ADAUGĂ ASTA PENTRU A ASCUNDE BUTONUL
                          onConfirm: () => {}
                        });
                        
                      } catch(err) {
                       // REPARAT: Alerta roșie în caz că Firebase dă vreo eroare
                       setAlertBox({
                         isOpen: true,
                         title: 'Eroare',
                         message: 'Eroare la creare: ' + err.message,
                         isDanger: true,
                         showCancel: false, // <--- ADAUGĂ LINIA ASTA CA SĂ ASCUNZI BUTONUL
                         onConfirm: () => setAlertBox({ isOpen: false, title: '', message: '', isDanger: false })
                       });
                      }
                         
                    }} className="space-y-3">

                           <input type="text" name="parola" placeholder="Parolă" 
                             onInput={(e) => e.target.setCustomValidity("")}
                             className="w-full p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 font-bold outline-none text-slate-800 dark:text-slate-100 text-sm mt-1" />
                        </div>
                      </div>
                      <select name="group" className="w-full p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 font-bold outline-none text-slate-800 dark:text-slate-100 text-sm cursor-pointer mt-2">

                        <input type="checkbox" name="isAdminGroup" className="w-4 h-4 text-blue-600 rounded-md border-slate-300 focus:ring-blue-500" />
                        <span className="text-[10px] font-black uppercase text-slate-600 dark:text-slate-300">Este Administrator de Grupă</span>
                      </label>
                      <button type="submit" className="w-full bg-blue-600 text-white p-3 rounded-xl font-black uppercase text-xs shadow-sm hover:bg-blue-700 transition">Creează</button>
                    </form>
                  </div>

                  <div>
                    <h4 className="text-xs font-black uppercase text-slate-500 mb-3">Utilizatori Existenți</h4>

                      <button

                        className={`px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-wider transition-all shrink-0 ${adminUserTab === 'All' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-50 dark:bg-slate-900 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200'}`}
                      >
                        Toți
                      </button>
                      {(settings.groups || DEFAULT_GROUPS).map(g => (
                        <button

                          className={`px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-wider transition-all shrink-0 ${adminUserTab === g ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-50 dark:bg-slate-900 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200'}`}

                          {g}
                        </button>

                    </div>

                    {/* Lista ta redesenată cu noul motor de filtrare și sortare */}

                      {/* MODIFICAT: Verificăm lungimea listei filtrate, nu a celei generale */}

                        getFilteredAndSortedUsers().map(u => (

                                    <span>Admin</span>

                            </div>
                            
                            {/* Butoanele tale originale de editare și ștergere (Rămase Neschimbate) */}
                            <div className="flex gap-2">
                              <button onClick={() => setModals({...modals, adminPanel: true, adminEditUser: { id: u.id, name: u.name, password: u.password, group: u.group, isAdminGroup: u.isAdminGroup }})} className="material-icons text-slate-400 hover:text-blue-500 text-lg p-2 bg-slate-50 dark:bg-slate-900 rounded-lg transition-colors shadow-sm">edit</button>
                              <button onClick={() => {
                                  setAlertBox({
                                      isOpen: true,
                                      title: 'Ștergere Utilizator',
                                      message: `Ești sigur că vrei să ștergi utilizatorul "${u.name}"? Acesta va fi deconectat instantaneu din aplicație.`,

                });
                setModals(m => ({ ...m, locationEdit: { ...m.locationEdit, loc: { ...m.locationEdit.loc, number: val } } }));
              }
            }}
            disabled={isReadOnly}
          />
        </div>
        <div className="flex gap-3">
          {canEditStructure && (
            <button 
              onClick={() => {
                setAlertBox({
                  isOpen: true,
                  title: 'Ștergere Apartament',
                  message: `Sigur dorești să ștergi definitiv numărul/apartamentul ${editLocNumber}?`,
                  isDanger: true,
                  onConfirm: () => {
                    const { blockId, sectionId, loc } = modals.locationEdit;
                    const docRef = selectedTerritory.category !== 'personal'
                      ? db.collection('shared_territories').doc(selectedTerritory.id)
                      : db.collection('users').doc(userDocId).collection('territories').doc(selectedTerritory.id);

                    db.runTransaction(async (transaction) => {
                      const doc = await transaction.get(docRef);
                      if (!doc.exists) return;
                      const data = doc.data();
                      const newBlocks = data.blocks.map(b => {
                        if (b.id !== blockId) return b;
                        return { 
                          ...b, 
                          sections: b.sections.map(s => {
                            if (s.id !== sectionId) return s;
                            return { ...s, locations: s.locations.filter(l => l.id !== loc.id) };
                          })
                        };
                      });
                      transaction.update(docRef, { blocks: newBlocks });
                    }).then(() => {
                      setModals({...modals, locationEdit: null});
                    }).catch(err => console.error("Eroare la ștergere:", err));
                  }
                });
              }} 
              className="w-12 h-12 flex items-center justify-center material-icons text-red-500 bg-white dark:bg-slate-700 border border-slate-100 dark:border-slate-700 rounded-xl hover:bg-red-50 hover:border-red-300 transition-all shadow-sm"
            >
              delete
            </button>
          )}
          <button 
            onClick={() => setModals({...modals, locationEdit: null})} 
            className="w-12 h-12 flex items-center justify-center material-icons text-slate-500 dark:text-slate-400 bg-slate-200 dark:bg-slate-700 rounded-xl transition-colors hover:bg-slate-300 dark:hover:bg-slate-600"
          >
            close
          </button>
        </div>
      </div>

      {/* Content Modal */}
      <div className="p-5 flex-1 overflow-y-scroll space-y-6">
        <div className="grid grid-cols-3 gap-2">
          {settings.labels.map(l => {
            const isSelected = l.id === modals.locationEdit.loc.status;
            return (
              <button 
                key={l.id} 
                onClick={() => {
                  const { blockId, sectionId, loc } = modals.locationEdit;
                  const newHistoryLocal = recordHistory(loc, 'status_change', l.id);
                  safeUpdateLocation(selectedTerritory.id, selectedTerritory.category, blockId, sectionId, loc.id, (currentLocFromServer) => {
                    const freshHistory = recordHistory(currentLocFromServer, 'status_change', l.id);
                    return { ...currentLocFromServer, status: l.id, history: freshHistory };
                  });
                  setModals(prev => ({
                    ...prev,
                    locationEdit: { ...prev.locationEdit, loc: { ...prev.locationEdit.loc, status: l.id, history: newHistoryLocal } }
                  }));
                }}
                style={{ backgroundColor: l.color, color: l.textColor }}
                className={`p-2 rounded-xl text-[9px] font-black uppercase border border-black/5 flex items-center justify-center text-center leading-tight min-h-[44px] shadow-sm active:scale-90 transition-all ${isSelected ? 'ring-4 ring-black dark:ring-white' : ''}`}
              >
                {l.label}
              </button>
            );
          })}
        </div>

        <div>
          <div className="flex items-center gap-2 ml-2 mb-2">
            <span className="material-icons text-slate-400 text-sm">edit_note</span>
            <span className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Notițe</span>
          </div>
          <ResizableTextarea 
            defaultValue={modals.locationEdit.loc.notes}
            onBlur={(e) => {
              const val = e.target.value.trim();
              const { blockId, sectionId, loc } = modals.locationEdit;
              if (val !== loc.notes) {
                safeUpdateLocation(selectedTerritory.id, selectedTerritory.category, blockId, sectionId, loc.id, (currentLocFromServer) => {
                  const freshHistory = recordHistory(currentLocFromServer, 'A modificat Notița');
                  return { ...currentLocFromServer, notes: val, history: freshHistory };
                });
                setModals(prev => ({
                  ...prev,
                  locationEdit: { ...prev.locationEdit, loc: { ...prev.locationEdit.loc, notes: val } }
                }));
              }
            }}
            placeholder="Scrie o notiță (Ex: Revin mâine)..."
            disabled={isReadOnly}
          />
        </div>

        {modals.locationEdit.loc.history && modals.locationEdit.loc.history.length > 0 && (
          <div className="bg-slate-50 dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col">
            <div className="bg-slate-200/50 dark:bg-slate-900/50 p-2 border-b border-slate-200 dark:border-slate-700 flex items-center justify-center gap-2 shrink-0">
               <span className="material-icons text-slate-400 text-sm">history</span>
               <span className="text-[10px] font-black uppercase text-slate-500 tracking-widest">Istoric Editări</span>
            </div>
            <div className="overflow-y-auto max-h-[130px] md:max-h-[195px] p-3 space-y-2 relative">
              {modals.locationEdit.loc.history.map((h, i) => {
                let displayAction = h.actiune || 'A editat';
                if (h.labelId) {
                  const foundLabel = settings.labels.find(lbl => lbl.id === h.labelId);
                  if (foundLabel) displayAction = foundLabel.label;
                } else {
                  const foundLabel = settings.labels.find(lbl => lbl.label === h.actiune);
                  if (foundLabel && !h.actiune.includes('Notiț')) displayAction = foundLabel.label;
                }
                return (
                  <div key={i} className="flex flex-col bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm shrink-0">
                    <div className="flex justify-between items-start w-full gap-2 mb-1">
                      <span className="text-xs font-black text-slate-700 dark:text-slate-200 leading-tight break-words flex-1">{h.name || 'Utilizator'}</span>
                      <div className="flex flex-col items-end shrink-0">
                        <span className="text-[9px] font-bold text-slate-400">{h.date}</span>
                        <span className="text-[9px] font-bold text-slate-400">{h.time}</span>
                      </div>
                    </div>
                    <span className="text-[10px] font-black uppercase text-blue-600 dark:text-blue-400 tracking-widest">{displayAction}</span>
                  </div>
                )
              })}
            </div>
          </div>
        )}

        {canEditStructure && (
          <p className="text-[10px] font-bold text-center text-slate-400 bg-slate-100 dark:bg-slate-900 p-2 rounded-xl flex items-center justify-center gap-1 shrink-0">
            <span className="material-icons text-sm">touch_app</span> Ține apăsat lung pătrățelul cu nr. apartament/casă pentru a le muta
          </p>
        )}
      </div>
    </div>
  </div>
)}

          {modals.settings && (
          
            <div className="fixed inset-0 bg-white dark:bg-slate-900 z-[200] flex flex-col p-6 overflow-y-auto transition-colors">
              <div className="flex items-center justify-between mb-8 shrink-0">
                <h2 className="font-black text-2xl text-slate-800 dark:text-slate-100 uppercase flex items-center gap-2">
                  <span className="material-icons text-blue-500 text-3xl">settings</span> Setări
                </h2>
                <button onClick={() => setModals({...modals, settings: false})} className="material-icons bg-slate-100 dark:bg-slate-800 p-3 rounded-full dark:text-slate-100 transition-colors">close</button>
              </div>
              {/* 2. SECȚIUNE GRUPE (Codul vechi) */}
              <div className="bg-slate-50 dark:bg-slate-800/50 p-4 md:p-6 rounded-[2rem] mb-8 border-2 border-slate-100 dark:border-slate-700 w-full max-w-[700px] mx-auto shadow-sm">
                 <h3 className="font-black text-sm uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2"><span className="material-icons">groups</span> Gestionare Grupe</h3>
                 <div className="space-y-3 mb-5">
                     {(settings.groups || DEFAULT_GROUPS).map(g => (
                         <div key={g} className="flex justify-between items-center bg-white dark:bg-slate-800 p-3 pl-5 rounded-2xl border border-slate-200 dark:border-slate-600 shadow-sm">
                             <span className="font-black text-sm uppercase text-slate-700 dark:text-slate-200">{g}</span>
                             <div className="flex gap-2">
                               {/* AJUSTAT: Am înlocuit vechiul prompt cu activarea promptBox-ului nostru */}
                                <button onClick={() => {
                                 setPromptBox({
                                     isOpen: true,
                                     title: 'Redenumește Grupa',
                                     placeholder: 'Introdu numele nou al grupei...',
                                     value: g, // Trimite numele actual al grupei ca valoare inițială în căsuță
                                     onConfirm: (newName) => handleRenameGroup(g, newName)
                                 });
                                 }} className="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-blue-500 material-icons bg-slate-50 dark:bg-slate-900 rounded-xl transition-colors shadow-sm">edit</button>
                                 <button onClick={() => handleDeleteGroup(g)} className="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-red-500 material-icons bg-slate-50 dark:bg-slate-900 rounded-xl transition-colors shadow-sm">delete</button>
                             </div>
                         </div>
                     ))}
                 </div>
                 <button onClick={() => {
                     setPromptBox({
                          isOpen: true,
                          title: 'Grupă Nouă',
                          placeholder: 'Ex: Grupa 6',
                          value: '',
                          onConfirm: (newName) => handleAddGroup(newName)
                       });
                       
                 }} className="w-full p-4 border-2 border-dashed border-blue-300 text-blue-500 font-black uppercase text-xs rounded-2xl flex items-center justify-center gap-2 hover:bg-blue-50 dark:hover:bg-blue-900/20 shadow-sm transition-colors">
                     <span className="material-icons">add</span> Adaugă Grupă
                 </button>
              </div>


             <div className="bg-slate-50 dark:bg-slate-800/50 p-4 md:p-6 rounded-[2rem] border-2 border-slate-100 dark:border-slate-700 w-full max-w-[700px] mx-auto shadow-sm mb-8">
                 <h3 className="font-black text-sm uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2"><span className="material-icons">palette</span> Etichete și culori</h3>
                 <SettingsLabelList settings={settings} setAlertBox={setAlertBox} updateSettingsLabels={(newLabels) => db.collection('config').doc('global_settings').set({ ...settings, labels: newLabels })} />
              </div>
            </div>
          )}
          {/* 1. ACESTA ESTE CODUL NOU PENTRU PROMPTBOX (ADĂUGAT ACUM)    */}
         {promptBox.isOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[250]">
              <div className="bg-white dark:bg-slate-800 rounded-[2.5rem] w-full max-w-sm p-6 shadow-2xl border-4 border-slate-100 dark:border-slate-700">
                <h3 className="font-black text-base text-slate-800 dark:text-slate-100 uppercase tracking-widest mb-4 flex items-center gap-2">
                  <span className="material-icons text-blue-500">edit_note</span> {promptBox.title}
                </h3>
                <input
                  id="promptBoxInput"
                  type="text"
                  placeholder={promptBox.placeholder}
                  value={promptBox.value}
                  onChange={(e) => {
                    e.target.setCustomValidity(""); // Ștergem eroarea când utilizatorul începe să scrie
                    setPromptBox({ ...promptBox, value: e.target.value });
                  }}
                  className="w-full bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-black border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 mb-6"
                />
                <div className="flex gap-2">
                  <button onClick={() => setPromptBox({ ...promptBox, isOpen: false })} className="flex-1 p-4 font-black text-slate-400 uppercase text-xs hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition-colors">Anulează</button>
                  <button onClick={() => { 
                    const inputEl = document.getElementById('promptBoxInput');
                    if (!valideazaCampul(inputEl, "Introdu o denumire!")) return; // Oprește și arată bula dacă e gol

                    promptBox.onConfirm(promptBox.value.trim()); 
                    setPromptBox({ ...promptBox, isOpen: false }); 
                  }} className="flex-[2] bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl font-black uppercase text-xs shadow-sm transition-all active:scale-95">Salvează</button>
                </div>
              </div>
            </div>
          )}
          {/* 2. ACESTA ESTE CODUL TĂU PENTRU ALERTBOX (RĂMÂNE NESCHIMBAT) */}
          {alertBox.isOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[300]">
              <div className="bg-white dark:bg-slate-800 rounded-[2.5rem] w-full max-w-sm p-6 shadow-2xl border-4 border-slate-100 dark:border-slate-700 text-center scale-up-animation">
                {/* Iconița */}
                <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-md ${alertBox.isDanger ? 'bg-red-50 text-red-500 border border-red-200' : 'bg-blue-50 text-blue-500 border border-blue-200'}`}>
                  <span className="material-icons text-3xl">{alertBox.isDanger ? 'warning' : 'info'}</span>
                 </div> 
                {/* Titlul */}
                <h3 className="font-black text-base text-slate-800 dark:text-slate-100 uppercase tracking-widest mb-2">{alertBox.title}</h3>
                {/* AICI ESTE REZOLVAREA - ne asigurăm că mesajul se afișează */}
                <p className="text-xs font-bold text-slate-500 dark:text-slate-400 mb-6 px-2 leading-relaxed">
                  {alertBox.message}
                </p>
                <div className="flex gap-2">
                  {/* Butonul de Anulare (apare doar dacă showCancel nu este false) */}
                  {alertBox.showCancel !== false && (
      
                    <button onClick={() => setAlertBox({ ...alertBox, isOpen: false })} className="flex-1 p-4 font-black text-slate-400 uppercase text-xs hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition-colors">Anulează</button>
                  )}
                  {/* Butonul de Confirmare (acum scrie "Confirm" când este notificare simplă) */}
                  <button onClick={() => { alertBox.onConfirm(); setAlertBox({ ...alertBox, isOpen: false }); }} className={`flex-1 p-4 text-white rounded-2xl font-black uppercase text-xs shadow-sm transition-all active:scale-95 ${alertBox.isDanger ? 'bg-red-600 hover:bg-red-700 shadow-red-500/20' : 'bg-blue-600 hover:bg-blue-700 shadow-blue-500/20'}`}>
                     {alertBox.showCancel === false ? 'Confirm' : 'Confirmă'}
                  </button>
                </div>
               </div>
             </div>
            )}

         {modals.theme && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[200]">
              <div className="bg-white dark:bg-slate-800 rounded-3xl w-full max-w-sm p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="font-black text-lg uppercase tracking-widest text-slate-800 dark:text-slate-100">Aspect Aplicație</h3>
                  <button onClick={() => setModals({...modals, theme: false})} className="material-icons text-slate-400 transition-colors">close</button>
                </div>
                <div className="space-y-3">
                  {[
                    { id: 'light', label: 'Tema Alba', icon: 'wb_sunny' },
                    { id: 'dark', label: 'Tema Neagra', icon: 'nightlight' },
                    { id: 'system', label: 'Sistem', icon: 'settings_brightness' }
                  ].map(t => (
                    <button 
                      key={t.id} 
                      onClick={() => { setTheme(t.id); localStorage.setItem('app-theme', t.id); setModals({...modals, theme: false}); }}
                      className={"w-full flex items-center gap-4 p-4 rounded-2xl font-black uppercase text-xs transition-all " + (theme === t.id ? "bg-blue-600 text-white shadow-lg" : "bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700")}
                    >
                      <span className="material-icons">{t.icon}</span>
                      {t.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* =================================================== */}
          {/* BULINA FILTRATĂ ȘI SECURIZATĂ PENTRU INLINE BABEL */}
          {/* 🟢 BULINA VERDE (Sincronizat)🟡 BULINA GALBENĂ (Se sincronizează) */}
          {isSynced ? (
            <div className="fixed bottom-4 left-4 z-[150] flex items-center gap-2 bg-slate-900/90 text-white px-3 py-1.5 rounded-full shadow-lg backdrop-blur-sm border border-slate-700 pointer-events-none select-none text-xs font-semibold">
              <span className="relative flex h-2 w-2">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
              </span>
              <span>Sincronizat</span>
            </div>
          ) : (
            
            <div className="fixed bottom-4 left-4 z-[150] flex items-center gap-2 bg-slate-900/90 text-white px-3 py-1.5 rounded-full shadow-lg backdrop-blur-sm border border-slate-700 pointer-events-none select-none text-xs font-semibold">
              <span className="relative flex h-2 w-2">
                <span className="relative inline-flex rounded-full h-2 w-2 bg-amber-500 animate-pulse"></span>
              </span>
              <span>Sincronizare...</span>
            </div>
          )}
          {/* =================================================== */}

        </div> 
      );
    } 

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  
  <script>
    // Această bucată spune telefonului să instaleze aplicația în fundal (Service Worker)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('Service Worker v3 activat cu succes!', registration.scope);
          })
          .catch((error) => {
            console.error('Eroare la activarea Service Worker:', error);
          });
      });
    }
  </script>
</body>
</html>
