                  {isAdmin && (
                    <button onClick={() => setModals({...modals, auth: false, profileEdit: true})} className="w-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 p-4 rounded-2xl font-black uppercase shadow-sm transition-colors flex items-center justify-center gap-2">
                      <span className="material-icons">edit</span> Editează Nume/Parolă
                    </button>
                  )}

                  <button onClick={async () => {
                    try { await auth.signOut(); } catch(e) {}
                    localStorage.removeItem('custom_user');
                    window.location.reload();
                  }} className="w-full bg-red-100 dark:bg-red-900/30 hover:bg-red-200 text-red-600 dark:text-red-400 p-4 rounded-2xl font-black uppercase shadow-sm transition-colors flex items-center justify-center gap-2">
                    <span className="material-icons">logout</span> Deconectare
                  </button>
                </div>
              </div>
            </div>

                        if(confirm('Ștergi definitiv acest număr?')) {
                          const { blockId, sectionId, loc } = modals.locationEdit;
                          const upd = selectedTerritory.blocks.map(b => b.id === blockId ? { ...b, sections: b.sections.map(s => s.id === sectionId ? { ...s, locations: s.locations.filter(l => l.id !== loc.id) } : s) } : b);
                          updateTerritory(selectedTerritory.id, selectedTerritory.category, { blocks: upd });
                          setModals({...modals, locationEdit: null});
                        }
                      }} className="w-12 h-12 flex items-center justify-center material-icons text-red-500 bg-white dark:bg-slate-700 border border-slate-100 dark:border-slate-700 rounded-xl hover:bg-red-50 hover:border-red-300 transition-all shadow-sm">delete</button>
                   )}
                    <button onClick={() => setModals({...modals, locationEdit: null})} className="w-12 h-12 flex items-center justify-center material-icons text-slate-500 dark:text-slate-400 bg-slate-200 dark:bg-slate-700 rounded-xl transition-colors hover:bg-slate-300 dark:hover:bg-slate-600">close</button>
                  </div>
                </div>

                <div className="p-5 flex-1 overflow-y-auto space-y-6">
                  <div className="grid grid-cols-3 gap-2">
                    {settings.labels.map(l => (
                      <button key={l.id} 
                        onClick={() => {
                          const { blockId, sectionId, loc } = modals.locationEdit;
                          const newHistory = recordHistory(loc, 'status_change', l.id);
                          const upd = selectedTerritory.blocks.map(b => b.id === blockId ? { ...b, sections: b.sections.map(s => s.id === sectionId ? { ...s, locations: s.locations.map(x => x.id === loc.id ? { ...x, status: l.id, history: newHistory } : x) } : s) } : b);
                          updateTerritory(selectedTerritory.id, selectedTerritory.category, { blocks: upd });
                          setModals({...modals, locationEdit: null});
                        }}
                        style={{ backgroundColor: l.color, color: l.textColor }}
                        className="p-2 rounded-xl text-[9px] font-black uppercase border border-black/5 flex items-center justify-center text-center leading-tight min-h-[44px] shadow-sm active:scale-90 transition-transform"
                      >
                        {l.label}
                      </button>
                    ))}
                  </div>

                  <div>
                    <div className="flex items-center gap-2 ml-2 mb-2">
                      <span className="material-icons text-slate-400 text-sm">edit_note</span>
                      <span className="text-[10px] font-black uppercase text-slate-400 tracking-widest">Notițe</span>
                    </div>
                    <ResizableTextarea 
                      defaultValue={modals.locationEdit.loc.notes}
                      onBlur={(e) => {
                         const val = e.target.value.trim();
                         const { blockId, sectionId, loc } = modals.locationEdit;
                         if (val !== loc.notes) {
                             const newHistory = recordHistory(loc, 'A modificat Notița');
                             const upd = selectedTerritory.blocks.map(b => b.id === blockId ? { ...b, sections: b.sections.map(s => s.id === sectionId ? { ...s, locations: s.locations.map(x => x.id === loc.id ? { ...x, notes: val, history: newHistory } : x) } : s) } : b);
                             updateTerritory(selectedTerritory.id, selectedTerritory.category, { blocks: upd });
                         }
                      }}
                      placeholder="Scrie o notiță (Ex: Revin mâine)..."
                      disabled={isReadOnly}
                    />
                  </div>
                  
                  {modals.locationEdit.loc.history && modals.locationEdit.loc.history.length > 0 && (
                    <div className="bg-slate-50 dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col">
                      <div className="bg-slate-200/50 dark:bg-slate-900/50 p-2 border-b border-slate-200 dark:border-slate-700 flex items-center justify-center gap-2 shrink-0">
                         <span className="material-icons text-slate-400 text-sm">history</span>
                         <span className="text-[10px] font-black uppercase text-slate-500 tracking-widest">Istoric Editări</span>
                      </div>
                      <div className="overflow-y-auto max-h-[130px] md:max-h-[195px] p-3 space-y-2 relative">
                        {modals.locationEdit.loc.history.map((h, i) => {
                          let displayAction = h.actiune || 'A editat';
                          if (h.labelId) {
                              const foundLabel = settings.labels.find(lbl => lbl.id === h.labelId);
                              if (foundLabel) displayAction = foundLabel.label;
                          } else {
                              const foundLabel = settings.labels.find(lbl => lbl.label === h.actiune);
                              if (foundLabel && !h.actiune.includes('Notiț')) displayAction = foundLabel.label;
                          }

                          return (
                            <div key={i} className="flex flex-col bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm shrink-0">
                              <div className="flex justify-between items-start w-full gap-2 mb-1">
                                  <span className="text-xs font-black text-slate-700 dark:text-slate-200 leading-tight break-words flex-1">{h.name || 'Utilizator'}</span>
                                  <div className="flex flex-col items-end shrink-0">
                                    <span className="text-[9px] font-bold text-slate-400">{h.date}</span>
                                    <span className="text-[9px] font-bold text-slate-400">{h.time}</span>
                                  </div>
                              </div>
                              <span className="text-[10px] font-black uppercase text-blue-600 dark:text-blue-400 tracking-widest">{displayAction}</span>
                            </div>
                          )
                        })}
                      </div>
                    </div>
                  )}

                  {canEditStructure && (
                     <p className="text-[10px] font-bold text-center text-slate-400 bg-slate-100 dark:bg-slate-900 p-2 rounded-xl flex items-center justify-center gap-1 shrink-0">
                       <span className="material-icons text-sm">touch_app</span> Ține apăsat lung pe pătrățel pentru a muta
                     </p>
                  )}

                </div>
              </div>
            </div>
          )}

          {modals.settings && (
            <div className="fixed inset-0 bg-white dark:bg-slate-900 z-[200] flex flex-col p-6 overflow-y-auto transition-colors">
              <div className="flex items-center justify-between mb-8 shrink-0">
                <h2 className="font-black text-2xl text-slate-800 dark:text-slate-100 uppercase flex items-center gap-2">
                  <span className="material-icons text-blue-500 text-3xl">palette</span> Setări
                </h2>
                <button onClick={() => setModals({...modals, settings: false})} className="material-icons bg-slate-100 dark:bg-slate-800 p-3 rounded-full dark:text-slate-100 transition-colors">close</button>
              </div>
              
              <div className="bg-slate-50 dark:bg-slate-800/50 p-4 md:p-6 rounded-[2rem] mb-8 border-2 border-slate-100 dark:border-slate-700 w-full max-w-[700px] mx-auto shadow-sm">
                 <h3 className="font-black text-sm uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2"><span className="material-icons">groups</span> Gestionare Grupe</h3>
                 <div className="space-y-3 mb-5">
                     {(settings.groups || DEFAULT_GROUPS).map(g => (
                         <div key={g} className="flex justify-between items-center bg-white dark:bg-slate-800 p-3 pl-5 rounded-2xl border border-slate-200 dark:border-slate-600 shadow-sm">
                             <span className="font-black text-sm uppercase text-slate-700 dark:text-slate-200">{g}</span>
                             <div className="flex gap-2">
                                 <button onClick={() => {
                                     const newName = prompt("Redenumește grupa (va actualiza automat și utilizatorii):", g);
                                     if(newName) handleRenameGroup(g, newName);
                                 }} className="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-blue-500 material-icons bg-slate-50 dark:bg-slate-900 rounded-xl transition-colors shadow-sm">edit</button>
                                 <button onClick={() => handleDeleteGroup(g)} className="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-red-500 material-icons bg-slate-50 dark:bg-slate-900 rounded-xl transition-colors shadow-sm">delete</button>
                             </div>
                         </div>
                     ))}
                 </div>
                 <button onClick={() => {
                     const newName = prompt("Introdu numele noii grupe:");
                     if(newName) handleAddGroup(newName);
                 }} className="w-full p-4 border-2 border-dashed border-blue-300 text-blue-500 font-black uppercase text-xs rounded-2xl flex items-center justify-center gap-2 hover:bg-blue-50 dark:hover:bg-blue-900/20 shadow-sm transition-colors">
                     <span className="material-icons">add</span> Adaugă Grupă
                 </button>
              </div>

              <SettingsLabelList settings={settings} updateSettingsLabels={(newLabels) => db.collection('users').doc(userDocId).collection('config').doc('settings').set({ ...settings, labels: newLabels })} />
            </div>
          )}

          {modals.theme && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[200]">
              <div className="bg-white dark:bg-slate-800 rounded-3xl w-full max-w-sm p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="font-black text-lg uppercase tracking-widest text-slate-800 dark:text-slate-100">Aspect Aplicație</h3>
                  <button onClick={() => setModals({...modals, theme: false})} className="material-icons text-slate-400 transition-colors">close</button>
                </div>
                <div className="space-y-3">
                  {[
                    { id: 'light', label: 'Tema Alba', icon: 'wb_sunny' },
                    { id: 'dark', label: 'Tema Neagra', icon: 'nightlight' },
                    { id: 'system', label: 'Sistem', icon: 'settings_brightness' }
                  ].map(t => (
                    <button 
                      key={t.id} 
                      onClick={() => { setTheme(t.id); localStorage.setItem('app-theme', t.id); setModals({...modals, theme: false}); }}
                      className={`w-full flex items-center gap-4 p-4 rounded-2xl font-black uppercase text-xs transition-all ${theme === t.id ? 'bg-blue-600 text-white shadow-lg' : 'bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700'}`}
                    >
                      <span className="material-icons">{t.icon}</span>
                      {t.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
